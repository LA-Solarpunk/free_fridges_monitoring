# --- Basic broker settings ---
persistence true
persistence_location /var/lib/mosquitto/
log_timestamp true
log_type error
log_type warning
log_type notice
log_type information

# Keep default listener OFF; define ours explicitly.
# Start safe: localhost only.
listener 1883
allow_anonymous true
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/fridge_aclfile
